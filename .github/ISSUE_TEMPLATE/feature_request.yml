name: Feature request
description: Suggest an improvement or a new feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion. Please keep in mind the project's design
        principles:

        - lockwell is 100% local. Features that need network connections or
          send telemetry will not be accepted.
        - Cryptography uses only standard, audited libraries.
        - New dependencies must be justified.

        For large changes, please wait for agreement in this issue before you
        start working on a pull request.

        **Never include sensitive data** such as passwords, keys or vault files.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem do you want to solve? Who is affected and when?
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have considered.
