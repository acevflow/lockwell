# Continuous integration: install, format, third-party licenses, type check,
# lint, test with coverage (report uploaded as an artifact) and build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only access to the repository contents is all the workflow needs.
permissions:
  contents: read

# Cancel earlier runs of the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Supported platforms. macOS and Linux will be added later.
        os: [windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt,llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # Coverage tool for the Rust tests; cached with the Rust dependencies.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Fails when Cargo.lock changed and THIRD-PARTY-LICENSES.md was not
      # regenerated with `npm run licenses`.
      - name: Check the third-party licenses
        run: npm run licenses:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs every test (Vitest, Rust unit and integration tests) with coverage.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: npm run tauri build
