# Release: when a v* tag is pushed, build the Windows installers, compute their
# SHA-256 checksums and publish a GitHub release with the notes of that
# version taken from CHANGELOG.md. The installers are not code-signed.
name: Release

on:
  push:
    tags: ["v*"]

# No permissions by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    name: Build installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Supported platforms. macOS and Linux will be added later.
        os: [windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # The tag must match the version of the app, so that the installers carry
      # the version of the release.
      - name: Check that the tag matches the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG" != "v$version" ] || [ "$tauri_version" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json ($version) and tauri.conf.json ($tauri_version)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: dist-release
          merge-multiple: true

      - name: Compute SHA-256 checksums
        working-directory: dist-release
        run: |
          sha256sum -- * | tee SHA256SUMS.txt

      # Prints the section of CHANGELOG.md for this version, without its
      # heading, up to the next version heading or the link references.
      - name: Extract the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No notes for version $version in CHANGELOG.md."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "lockwell $TAG" \
            --notes-file release-notes.md
