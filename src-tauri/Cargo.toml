[package]
name = "lockwell"
version = "0.0.0"
description = "A local-only, encrypted password and file manager for the desktop."
authors = ["acevflow"]
license = "GPL-3.0-or-later"
repository = "https://github.com/acevflow/lockwell"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lockwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aead-stream = { version = "0.6", features = ["alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
tauri = { version = "2", features = [] }
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }

# Optimize the cryptographic crates in debug builds too: unoptimized Argon2
# makes the tests and unlocking in `tauri dev` needlessly slow.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
